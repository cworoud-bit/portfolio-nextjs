name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: portfolio-nextjs

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-push
    runs-on: self-hosted   # runner installe sur ta machine (Windows)
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ needs.build-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy (docker compose)
        shell: pwsh
        run: |
          docker compose pull
          docker compose up -d

      - name: Health check
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest http://localhost:3001 -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "Health check failed" }
          Write-Host "OK : http://localhost:3001 ($env:TAG)"
